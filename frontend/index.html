<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#4263eb" />
    <meta name="description" content="Velora - Premium mobile phones, accessories, and gadgets from top brands. Shop earbuds, headphones, chargers, smart watches, covers, and more." />
    <meta name="keywords" content="velora, mobile phones, smartphones, earbuds, headphones, chargers, smart watches, accessories, Pakistan" />
    <meta name="author" content="Velora" />
    <meta name="robots" content="index, follow" />
    
    <!-- Security Headers -->
    <meta http-equiv="X-Content-Type-Options" content="nosniff" />
    <meta http-equiv="X-Frame-Options" content="DENY" />
    <meta http-equiv="X-XSS-Protection" content="1; mode=block" />
    <meta http-equiv="Referrer-Policy" content="strict-origin-when-cross-origin" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://*.clerk.dev https://*.clerk.com https://challenges.cloudflare.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: https: blob:; connect-src 'self' https://*.clerk.dev https://*.clerk.com https://api.clerk.com; frame-src 'self' https://*.clerk.dev https://*.clerk.com;" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Velora - Premium Tech Accessories & Gadgets" />
    <meta property="og:description" content="Shop the latest mobile phones, earbuds, headphones, chargers, and more from top brands." />
    <meta property="og:url" content="https://velora.pk" />
    <meta property="og:site_name" content="Velora" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Velora - Premium Tech Accessories & Gadgets" />
    <meta name="twitter:description" content="Shop the latest mobile phones, earbuds, headphones, chargers, and more." />

    <link rel="apple-touch-icon" href="/logo192.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />
    <title>Velora - Premium Tech Accessories & Gadgets</title>

    <!-- Structured Data -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "Velora",
      "url": "https://velora.pk",
      "description": "Premium mobile phones, accessories, and gadgets from top brands.",
      "potentialAction": {
        "@type": "SearchAction",
        "target": "https://velora.pk/shop?search={search_term_string}",
        "query-input": "required name=search_term_string"
      }
    }
    </script>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
